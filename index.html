<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick</title>
<style>
  :root {
    --bg: #fbfbf9;
    --fg: #1a1a18;
    --muted: #6b6b63;
    --rule: #e2e2dc;
    --accent: #b5522f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f;
      --fg: #eeeee6;
      --muted: #9a9a8f;
      --rule: #2c2c25;
      --accent: #e08a5f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 34rem; }
  h1 {
    margin: 0 0 .35rem;
    font-size: clamp(2.1rem, 7vw, 3rem);
    font-weight: 600;
    letter-spacing: -.025em;
  }
  .tag {
    margin: 0 0 1.75rem;
    color: var(--muted);
    font-size: 1.0625rem;
  }
  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 0 0 1.75rem;
  }
  p { margin: 0 0 1rem; }
  .note { color: var(--muted); font-size: .9375rem; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .875em;
    background: color-mix(in srgb, var(--fg) 7%, transparent);
    padding: .12em .38em;
    border-radius: 4px;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  footer {
    margin-top: 2.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: .875rem;
  }
</style>
</head>
<body>
<main>
  <h1>Nick</h1>
  <p class="tag">Placeholder &mdash; something better is coming.</p>
  <hr>
  <p>This page is live and served by GitHub Pages, which means the plumbing works. All that&rsquo;s left is deciding what goes here.</p>
  <p class="note">To change it, edit <code>index.html</code> and push to <code>main</code>. The site rebuilds on its own within a minute or so.</p>
  <footer>
    Source on <a href="https://github.com/nicknash/nicknash.github.io">GitHub</a>.
  </footer>
</main>
</body>
</html>
