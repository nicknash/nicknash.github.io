<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ site_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<link rel="alternate" type="application/rss+xml" title="{{ site_title }} RSS" href="/feed.xml">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:type" content="article">
<link rel="stylesheet" href="/assets/site.css">
<link rel="preload" href="/assets/fonts/STIXTwoText-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="/">{{ site_title }}</a>
    <nav aria-label="Main">
      {{ nav }}
    </nav>
  </div>
</header>

<main id="main">
  <article class="doc">
    <header class="doc-head">
      <h1>{{ page_title }}</h1>
      <p class="doc-meta">{{ page_meta }}</p>
    </header>
    {{ content }}
  </article>
</main>

<footer class="site-footer">
  <p>© {{ year }} {{ site_title }} · built from LaTeX ·
     <a href="https://github.com/nicknash/nicknash.github.io">source</a></p>
</footer>

</body>
</html>
