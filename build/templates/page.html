<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ site_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<link rel="alternate" type="application/rss+xml" title="{{ site_title }} RSS" href="/feed.xml">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:type" content="article">
<link rel="stylesheet" href="/assets/site.css">
<link rel="preload" href="/assets/fonts/STIXTwoText-Regular.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Applied before first paint so a dark-theme reader never sees a white flash.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="/">{{ site_title }}</a>
    <nav aria-label="Main">
      {{ nav }}
    </nav>
    <button id="theme-toggle" type="button" class="theme-toggle"
            aria-label="Switch between light and dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
        <path class="sun" fill="currentColor"
              d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-13.5a1 1 0 0 1 1 1V6a1 1 0 1 1-2 0V4.5a1 1 0 0 1 1-1zm0 15a1 1 0 0 1 1 1V21a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1zM3.5 12a1 1 0 0 1 1-1H6a1 1 0 1 1 0 2H4.5a1 1 0 0 1-1-1zm15 0a1 1 0 0 1 1-1H21a1 1 0 1 1 0 2h-1.5a1 1 0 0 1-1-1zM5.6 5.6a1 1 0 0 1 1.4 0l1 1a1 1 0 0 1-1.4 1.4l-1-1a1 1 0 0 1 0-1.4zm10.4 10.4a1 1 0 0 1 1.4 0l1 1a1 1 0 0 1-1.4 1.4l-1-1a1 1 0 0 1 0-1.4zm2.4-10.4a1 1 0 0 1 0 1.4l-1 1A1 1 0 0 1 16 6.6l1-1a1 1 0 0 1 1.4 0zM7 16a1 1 0 0 1 0 1.4l-1 1a1 1 0 0 1-1.4-1.4l1-1a1 1 0 0 1 1.4 0z"/>
        <path class="moon" fill="currentColor"
              d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">
  <article class="doc">
    <header class="doc-head">
      <h1>{{ page_title }}</h1>
      <p class="doc-meta">{{ page_meta }}</p>
    </header>
    {{ content }}
  </article>
</main>

<footer class="site-footer">
  <p>© {{ year }} {{ site_title }} · built from LaTeX ·
     <a href="https://github.com/nicknash/nicknash.github.io">source</a></p>
</footer>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var dark = root.getAttribute('data-theme') === 'dark'
        || (!root.hasAttribute('data-theme')
            && matchMedia('(prefers-color-scheme: dark)').matches);
      var next = dark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
